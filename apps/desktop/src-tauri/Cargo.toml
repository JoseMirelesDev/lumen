[package]
name = "lumen"
version = "0.1.0"
description = "Lumen — ultralight Discord-like voice + screen share"
authors = ["Lumen contributors"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
webrtc = "0.20"
rtc = { version = "0.20", default-features = false, features = ["ring"] }
cpal = "0.18"
opus = "0.3"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[patch.crates-io]
wry = { path = "../../../vendor/wry" }
