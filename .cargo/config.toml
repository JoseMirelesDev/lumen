# Windows: Skia's bundled ICU is static (skunicode_icu.lib), but the linker was
# pulling the system import libs icu.lib/icuuc.lib -> exe depended on icu.dll/icuuc.dll
# at runtime and failed on machines with old/no ICU (ucptrie_close missing).
# /FORCE:MULTIPLE keeps the first (static) duplicate (ubrk_* etc.) and discards the import-thunk copy.
# /NODEFAULTLIB suppresses the automatic /DEFAULTLIB:icu.lib and /DEFAULTLIB:icuuc.lib that
# Skia's objects or the Windows SDK inject via #pragma comment(lib, ...).
# /DELAYLOAD makes any remaining raw-dylib icu imports (windows-sys Win32_Globalization via dirs-sys/winit)
# delay-loaded via delayimp.lib, so the exe starts even if system icu.dll is old/missing
# (we don't call windows::Globalization::ucptrie, only Skia's static one).
# Result: no hard dependency on icu.dll/icuuc.dll (see release.yml verify step).
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-C", "linker=lld-link",
  "-C", "link-arg=/FORCE:MULTIPLE",
  "-C", "link-arg=/NODEFAULTLIB:icu",
  "-C", "link-arg=/NODEFAULTLIB:icu.lib",
  "-C", "link-arg=/NODEFAULTLIB:icuuc",
  "-C", "link-arg=/NODEFAULTLIB:icuuc.lib",
  "-C", "link-arg=/NODEFAULTLIB:icuin",
  "-C", "link-arg=/NODEFAULTLIB:icuin.lib",
  "-C", "link-arg=/NODEFAULTLIB:icudt",
  "-C", "link-arg=/NODEFAULTLIB:icudt.lib",
  "-C", "link-arg=/NODEFAULTLIB:icuio",
  "-C", "link-arg=/NODEFAULTLIB:icuio.lib",
  "-C", "link-arg=/NODEFAULTLIB:icutu",
  "-C", "link-arg=/NODEFAULTLIB:icutu.lib",
  "-C", "link-arg=/DELAYLOAD:icu.dll",
  "-C", "link-arg=/DELAYLOAD:icuuc.dll",
  "-C", "link-arg=delayimp.lib",
]

