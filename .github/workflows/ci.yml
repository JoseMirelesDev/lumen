name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/protocol typecheck

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/backend typecheck
      - run: pnpm --filter @lumen/backend lint
      - run: pnpm --filter @lumen/backend test

  # Native Slint client: compile check on every push/PR (release artifacts
  # come from release.yml on tags). Windows needs the MSVC toolchain pinned
  # (meson picks gcc from PATH otherwise) + llvm-tools for rust-objcopy, and
  # /std:c++20 for webrtc-audio-processing — mirror release.yml exactly.
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
            cc: cl
            cxx: cl
            cxxflags: "/std:c++20"
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Per-object Rust compile cache (sccache, backed by the GH cache).
      # Survives partial/evicted cargo target caches — the previous pain: a
      # RUSTFLAGS change or an oversized/evicted target meant a full rebuild.
      # The action sets RUSTC_WRAPPER=sccache and SCCACHE_GHA_CACHE=1.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake build-essential \
            libasound2-dev libfontconfig1-dev libx11-dev libxrender-dev \
            libwayland-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            meson ninja-build libclang-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config meson ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.cc != ''
      - name: Install meson/ninja + llvm-tools (Windows)
        if: matrix.cc != ''
        shell: pwsh
        run: |
          python -m pip install meson ninja
          rustup component add llvm-tools-preview
      - name: Point build at MSVC (Windows)
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${{ matrix.cxxflags }}" >> "$GITHUB_ENV"
          # fe (FastEnhancer) builds with MinGW gcc (GNU .a); lld-link reads
          # both the MSVC .lib (webrtc) and the GNU .a in one link. Enabled
          # now that the webrtc fresh-build bug (pthread.h) is fixed.
          # /FORCE:MULTIPLE: skia's bundled ICU = static objects in
          # skunicode_icu.lib + an icuuc.dll import (skia-bindings Windows
          # quirk) → duplicate u* symbols at link; identical copies, the
          # linker keeps the static one.
          # /NODEFAULTLIB:icu.lib + icuuc.lib suppress the automatic
          # /DEFAULTLIB:icu.lib/icuuc.lib that Skia injects, otherwise the
          # exe imports icu.dll/icuuc.dll and fails on clean Windows
          # (ucptrie_close missing).
          echo "RUSTFLAGS=-C linker=lld-link -C link-arg=/FORCE:MULTIPLE -C link-arg=/NODEFAULTLIB:icu.lib -C link-arg=/NODEFAULTLIB:icuuc.lib" >> "$GITHUB_ENV"
      - name: Build lumen-desktop (debug)
        run: cargo build -p lumen-desktop
        env:
          # audiopus_sys bundles a libopus whose CMakeLists needs CMake < 3.5
          # compat, which CMake 4.x removed. Official escape hatch.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Verify no ICU DLL dependency (Windows)
        if: matrix.cc != ''
        shell: pwsh
        run: |
          $exe = "target/debug/lumen.exe"
          if (!(Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          $imports = & dumpbin /DEPENDENTS $exe | Out-String
          Write-Host $imports
          if ($imports -match "icu\.dll|icuuc\.dll") {
            Write-Error "ERROR: lumen.exe still imports icu.dll/icuuc.dll - static link failed (ucptrie_close will be missing on clean Windows)"
            exit 1
          }
          Write-Host "OK: no icu.dll/icuuc.dll dependency - ICU is static"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.os }}
          path: |
            ${{ runner.os == 'Windows' && 'target/debug/lumen.exe' || 'target/debug/lumen' }}
            target/${{ runner.os == 'Windows' && 'debug/*.dll' || 'debug/none' }}
          if-no-files-found: error

  # Denoiser probe: build the voice crate (incl. sherpa-onnx / GTCRN — the
  # heavy onnxruntime dep that fails locally) and run the headless DSP probe,
  # printing the real noise-reduction / speech-preservation numbers. Local
  # builds can't handle the sherpa-onnx-sys link, so we iterate here instead.
  voice-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake build-essential \
            libasound2-dev libfontconfig1-dev libx11-dev libxrender-dev \
            libwayland-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            meson ninja-build libclang-dev
      - name: Build + run DeepFilterNet denoiser probe (release, for real RTF)
        run: cargo test --release -p lumen-voice --test deepfilter_probe -- --nocapture
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
