name: CI

on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/protocol typecheck

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/backend typecheck
      - run: pnpm --filter @lumen/backend lint
      - run: pnpm --filter @lumen/backend test

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev pkg-config cmake build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/desktop check
      - run: pnpm --filter @lumen/desktop build
      - name: Bundle installers (.deb/.rpm/.AppImage)
        run: pnpm --filter @lumen/desktop tauri build
        env:
          CI: "false"
          # audiopus_sys bundles a libopus whose CMakeLists needs CMake < 3.5
          # compat, which CMake 4.x removed. This env is the official escape hatch.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/desktop check
      - run: pnpm --filter @lumen/desktop build
      - name: Bundle installer (.msi)
        run: pnpm --filter @lumen/desktop tauri build
        env:
          CI: "false"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: brew install cmake pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/desktop check
      - run: pnpm --filter @lumen/desktop build
      - name: Bundle installer (.dmg)
        run: pnpm --filter @lumen/desktop tauri build
        env:
          CI: "false"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
