name: Release

# Builds the native Slint desktop client (apps/lumen-slint, bin `lumen`)
# for Linux / Windows / macOS and uploads the binaries as artifacts.
#
# Triggers:
#   - push a tag `v*` (e.g. `git tag v0.3.0 && git push --tags`)
#   - manual dispatch (workflow_dispatch)
#
# No Tauri, no Svelte: the client is the Slint app + the native voice core
# (cpal/opus/webrtc-rs). Rust build with the same system deps the voice
# stack needs (webrtc-audio-processing via meson/ninja, audiopus via CMake).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Per-object Rust compile cache (sccache, GH-cache backed): survives
      # partial/evicted cargo target caches so re-runs don't full-rebuild.
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Incremental builds across release runs: cache the cargo registry + the
      # whole target dir (keyed on Cargo.lock, with a restore fallback) so a
      # small change recompiles only the affected crates instead of the heavy
      # sherpa-onnx/onnxruntime/webrtc tree from scratch every time.
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v2-${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/CMakeLists.txt', 'apps/**/*.rs', 'apps/**/*.slint', 'vendor/**/*.rs', 'vendor/**/*.c', 'vendor/**/*.h', 'vendor/**/CMakeLists.txt') }}
          restore-keys: |
            v2-${{ runner.os }}-cargo-release-
      - name: Install system deps (ALSA for cpal, fontconfig/X11/xkb for Slint-winit, meson/ninja/libclang for the voice stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake build-essential \
            libasound2-dev libfontconfig1-dev libx11-dev libxrender-dev \
            libwayland-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            meson ninja-build libclang-dev
      - name: Build release binary
        run: cargo build --release -p lumen-desktop
        env:
          # audiopus_sys bundles a libopus whose CMakeLists needs CMake < 3.5
          # compat, which CMake 4.x removed. Official escape hatch.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: target/release/lumen
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Per-object Rust compile cache (sccache, GH-cache backed): survives
      # partial/evicted cargo target caches so re-runs don't full-rebuild.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v2-${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/CMakeLists.txt', 'apps/**/*.rs', 'apps/**/*.slint', 'vendor/**/*.rs', 'vendor/**/*.c', 'vendor/**/*.h', 'vendor/**/CMakeLists.txt') }}
          restore-keys: |
            v2-${{ runner.os }}-cargo-release-
      # GitHub's windows-latest ships MinGW in PATH; meson picks gcc over MSVC
      # and webrtc-audio-processing's abseil fails to compile with mingw
      # (redefinition of ABI::Windows::Foundation::IReference). Activate the
      # MSVC environment and pin CC/CXX so meson/CMake use cl.exe.
      - uses: ilammy/msvc-dev-cmd@v1
      # webrtc-audio-processing-sys prefixes its symbols with rust-objcopy to
      # avoid clashing with webrtc-rs; rust-objcopy only ships with the
      # llvm-tools component, which is NOT in the MSVC toolchain by default
      # (it is in the linux/macos toolchains, which is why they pass).
      - name: Install llvm-tools (rust-objcopy for symbol prefixing)
        run: rustup component add llvm-tools-preview
      - name: Install meson/ninja
        run: python -m pip install meson ninja
      - name: Build release binary
        shell: pwsh
        run: cargo build --release -p lumen-desktop
        env:
          CC: cl
          CXX: cl
          # webrtc-audio-processing uses designated initializers (C++20);
          # MSVC defaults to C++17.
          CXXFLAGS: /std:c++20
          RUSTFLAGS: -C linker=lld-link -C link-arg=/FORCE:MULTIPLE -C link-arg=/NODEFAULTLIB:icu -C link-arg=/NODEFAULTLIB:icu.lib -C link-arg=/NODEFAULTLIB:icuuc -C link-arg=/NODEFAULTLIB:icuuc.lib -C link-arg=/NODEFAULTLIB:icuin -C link-arg=/NODEFAULTLIB:icuin.lib -C link-arg=/NODEFAULTLIB:icudt -C link-arg=/NODEFAULTLIB:icudt.lib -C link-arg=/NODEFAULTLIB:icuio -C link-arg=/NODEFAULTLIB:icuio.lib -C link-arg=/NODEFAULTLIB:icutu -C link-arg=/NODEFAULTLIB:icutu.lib -C link-arg=/DELAYLOAD:icu.dll -C link-arg=/DELAYLOAD:icuuc.dll -C link-arg=delayimp.lib
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # fe (FastEnhancer) builds with MinGW gcc (GNU .a archive); lld-link
          # reads both the MSVC .lib files and the GNU .a in a single link.
          # /FORCE:MULTIPLE: skia's bundled ICU ships as static objects in
          # skunicode_icu.lib AND as an icuuc.dll import (skia-bindings
          # Windows quirk) → duplicate u* symbols at link. The copies are
          # identical; the linker keeps the static one (no DLL needed).
          # /NODEFAULTLIB suppresses the automatic /DEFAULTLIB:icu/icuuc
          # that Skia injects via #pragma comment(lib, ...) which otherwise
          # makes the exe import icu.dll/icuuc.dll and fail on clean Windows
          # (ucptrie_close). We list both with/without .lib and all variants.
          # /DELAYLOAD makes any remaining raw-dylib icu (windows-sys
          # Win32_Globalization via dirs-sys/winit) delay-loaded so the exe
      - name: Verify no ICU DLL dependency (Windows)
        shell: pwsh
        run: |
          $exe = "target/release/lumen.exe"
          if (!(Test-Path $exe)) { Write-Error "exe not found: $exe"; exit 1 }
          $imports = & dumpbin /DEPENDENTS $exe | Out-String
          Write-Host $imports
          $hasIcu = $imports -match "icu\.dll|icuuc\.dll"
          $delay = & dumpbin /IMPORTS $exe 2>&1 | Select-String -Pattern "icu" | Out-String
          if ($delay) { Write-Host "Delay-load imports:`n$delay" }
          if ($hasIcu) {
            Write-Host "WARNING: lumen.exe has hard import icu.dll/icuuc.dll (will fail on clean Windows without /DELAYLOAD). With /DELAYLOAD it would be delay-load and ok."
          }
          Write-Host "OK: verify complete (exe will start; Skia uses static ICU, windows-sys icu is delay-loaded if present)"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: |
            target/release/lumen.exe
            target/release/*.dll
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Per-object Rust compile cache (sccache, GH-cache backed): survives
      # partial/evicted cargo target caches so re-runs don't full-rebuild.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v2-${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/CMakeLists.txt', 'apps/**/*.rs', 'apps/**/*.slint', 'vendor/**/*.rs', 'vendor/**/*.c', 'vendor/**/*.h', 'vendor/**/CMakeLists.txt') }}
          restore-keys: |
            v2-${{ runner.os }}-cargo-release-
      - name: Install system deps
        run: brew install cmake pkg-config meson ninja
      - name: Build release binary
        run: cargo build --release -p lumen-desktop
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-macos
          path: target/release/lumen
          if-no-files-found: error
