name: Release

# Publishes the desktop bundles as a GitHub Release.
#
# Triggers:
#   - push a tag `v*` (e.g. `git tag v0.2.1 && git push --tags`)
#   - manual dispatch (workflow_dispatch) with a version string
#
# The release is created as a DRAFT so you can review the assets before
# publishing. Installers: Linux (.deb/.rpm/.AppImage), Windows (.msi),
# macOS (.dmg, unsigned).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.1). Ignored when pushed from a v* tag."
        required: false

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev pkg-config cmake build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/desktop build
      - name: Bundle installers (.deb/.rpm/.AppImage)
        run: pnpm --filter @lumen/desktop tauri build
        env:
          CI: "false"
          # audiopus_sys bundles a libopus whose CMakeLists needs CMake < 3.5
          # compat, which CMake 4.x removed. This env is the official escape hatch.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/desktop build
      - name: Bundle installer (.msi)
        run: pnpm --filter @lumen/desktop tauri build
        env:
          CI: "false"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: brew install cmake pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/desktop build
      - name: Bundle installer (.dmg)
        run: pnpm --filter @lumen/desktop tauri build
        env:
          CI: "false"
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [release-linux, release-windows, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            V="${{ inputs.version }}"
            if [ -z "$V" ]; then V="manual-$(date +%Y%m%d%H%M%S)"; fi
            echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lumen ${{ steps.version.outputs.tag }}
          body: |
            Desktop bundles for Lumen (native voice client).

            Linux: `.deb` / `.rpm` / `.AppImage`
            Windows: `.msi`
            macOS: `.dmg` (unsigned)

            > This is a draft — review and publish manually from the Releases page.
          draft: true
          # `**` (recursive): the Linux bundle lives in dist/deb/ and
          # dist/rpm/ subdirectories — a flat `dist/*` would silently skip them.
          files: dist/**
