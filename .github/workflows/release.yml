name: Release

# Builds the native Slint desktop client (apps/lumen-slint, bin `lumen`)
# for Linux / Windows / macOS and uploads the binaries as artifacts.
#
# Triggers:
#   - push a tag `v*` (e.g. `git tag v0.3.0 && git push --tags`)
#   - manual dispatch (workflow_dispatch)
#
# No Tauri, no Svelte: the client is the Slint app + the native voice core
# (cpal/opus/webrtc-rs). Rust build with the same system deps the voice
# stack needs (webrtc-audio-processing via meson/ninja, audiopus via CMake).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (ALSA for cpal, X11/xkb for winit, meson/ninja/libclang for the voice stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake build-essential \
            libasound2-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            meson ninja-build libclang-dev python3-pip
          python3 -m pip install meson ninja
      - name: Build release binary
        run: cargo build --release -p lumen-desktop
        env:
          # audiopus_sys bundles a libopus whose CMakeLists needs CMake < 3.5
          # compat, which CMake 4.x removed. Official escape hatch.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-linux
          path: target/release/lumen
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub's windows-latest ships MinGW in PATH; meson picks gcc over MSVC
      # and webrtc-audio-processing's abseil fails to compile with mingw
      # (redefinition of ABI::Windows::Foundation::IReference). Activate the
      # MSVC environment and pin CC/CXX so meson/CMake use cl.exe.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install meson/ninja
        run: python -m pip install meson ninja
      - name: Build release binary
        shell: pwsh
        run: cargo build --release -p lumen-desktop
        env:
          CC: cl
          CXX: cl
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: target/release/lumen.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          brew install cmake pkg-config meson ninja
          python3 -m pip install meson ninja
      - name: Build release binary
        run: cargo build --release -p lumen-desktop
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-macos
          path: target/release/lumen
          if-no-files-found: error
