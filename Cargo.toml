# Lumen Cargo workspace (desktop client). The TS side still uses pnpm
# workspaces (apps/*, packages/*); the Rust crates live here.
[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "apps/lumen-slint",
    "crates/lumen-voice",
    "crates/lumen-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# tract's "codegen" pass (used by DeepFilterNet to build its model graph)
# panics on a debug_assert in unoptimized dev builds, silently dropping
# DeepFilterNet to the RNNoise fallback. Disable debug assertions just for the
# tract crates in dev so DeepFilterNet loads while the rest of the tree keeps
# its dev assertions.
[profile.dev.package.tract-linalg]
debug-assertions = false
[profile.dev.package.tract-core]
debug-assertions = false
[profile.dev.package.tract-pulse]
debug-assertions = false
[profile.dev.package.tract-hir]
debug-assertions = false
[profile.dev.package.tract-onnx]
debug-assertions = false

[workspace.dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-winit-software"] }
slint-build = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
webrtc = "0.20"
rtc = { version = "0.20", default-features = false, features = ["ring"] }
cpal = "0.18"
opus = "0.3"
parking_lot = "0.12"
webrtc-audio-processing = { version = "2.1.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
directories = "6"
thiserror = "2"

# Vendored wry patch (WebKitGTK media-permission hook). Must live at the
# workspace root — a patch in a workspace member is silently ignored.
[patch.crates-io]
wry = { path = "vendor/wry" }
# Vendored webrtc-audio-processing-sys patch: drops the GCC-only
# -Wno-unused-parameter flag that breaks MSVC (cl D8021).
webrtc-audio-processing-sys = { path = "vendor/webrtc-audio-processing-sys" }

# Disk policy: dev builds keep ONLY line tables (file:line in backtraces), not
# full debug symbols. Test binaries drop from ~315 MB to ~30-40 MB each and
# the tract/df rlibs from ~430 MB to a fraction. RUST_BACKTRACE still shows
# file:line; local variable inspection via a debugger needs a one-off
# `RUSTFLAGS=-Cdebuginfo=2 cargo build`.
[profile.dev]
debug = "line-tables-only"
