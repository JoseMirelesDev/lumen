[package]
name = "lumen-voice"
version.workspace = true
edition.workspace = true
description = "Lumen native voice core — cpal/opus/webrtc-rs, framework-agnostic (no Tauri, no UI)"
license = "MIT"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
cpal.workspace = true
futures-util.workspace = true
opus.workspace = true
parking_lot.workspace = true
rand.workspace = true
rtc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
webrtc.workspace = true
webrtc-audio-processing.workspace = true
# NetEQ-inspired adaptive jitter buffer for the receive path (replaces the
# hand-rolled JitterBuffer). Core-only: no cpal/axum/tokio/ropus features.
neteq = { version = "0.9", default-features = false }
# RNNoise (pure-Rust port) neural noise suppression — the Krisp-style NS that
# beats the classic WebRTC NS on non-stationary background noise. No C deps.
nnnoiseless = "0.5"
# GTCRN neural denoiser (sherpa-onnx): 32-38 dB noise reduction, ~10x real-time
# on this CPU. On Linux/macOS the prebuilt static lib links cleanly; on Windows
# the prebuilt static lib is built with the MSVC /MT (static) CRT, which clashes
# with Rust's default /MD and breaks the link with LNK2005 (multiply-defined
# std symbols). Use the shared (DLL) onnxruntime on Windows instead: it uses
# /MD like the rest of the build, and sherpa-onnx-sys copies the DLLs next to
# the exe at build time. Replaces RNNoise as the primary send-path denoiser.
[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = { version = "1.13", default-features = false, features = ["static"] }

[dev-dependencies]
reqwest.workspace = true

# cpal 0.18.1's WASAPI code requires `windows` + `windows-core` to resolve as a
# *matched* pair (its range `>=0.61,<=0.62` lets cargo pair `windows 0.61` with
# `windows-core 0.62`, which breaks compilation). Pin both to 0.62.2 so the
# whole graph shares one matched pair.
[target.'cfg(target_os = "windows")'.dependencies]
windows = "=0.62.2"
windows-core = "=0.62.2"
