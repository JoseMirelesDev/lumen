[package]
name = "lumen-voice"
version.workspace = true
edition.workspace = true
description = "Lumen native voice core — cpal/opus/webrtc-rs, framework-agnostic (no Tauri, no UI)"
license = "MIT"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
cpal.workspace = true
futures-util.workspace = true
opus.workspace = true
parking_lot.workspace = true
rand.workspace = true
rtc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
webrtc.workspace = true
webrtc-audio-processing.workspace = true
# NetEQ-inspired adaptive jitter buffer for the receive path (replaces the
# hand-rolled JitterBuffer). Core-only: no cpal/axum/tokio/ropus features.
neteq = { version = "0.9", default-features = false }
# ndarray: DeepFilterNet's DfTract::process takes/returns Array2 views.
ndarray = "0.15"
# RNNoise (pure-Rust port) neural noise suppression — the LIGHT fallback (used
# only if DeepFilterNet can't load). No C deps.
nnnoiseless = "0.5"
# DeepFilterNet3 (full-band 48 kHz) — the primary send-path denoiser. This is
# the Rust core (`libDF`) using `tract` (a pure-Rust ONNX runtime), so there is
# NO onnxruntime and no C-symbol collision. Measured ~4-5% of a core (RTF
# ~0.04) on a 2014 i5 with full 48 kHz bandwidth — strictly cheaper AND better
# than the old GTCRN (16 kHz band-limited, ~23% of a core). The `default-model`
# feature embeds DeepFilterNet3_onnx.tar.gz. We import it as `df`.
df = { package = "deep_filter", git = "https://github.com/Rikorose/DeepFilterNet", features = ["tract", "default-model"] }
# Pin tract to the version libDF was built against (its repo Cargo.lock uses
# 0.21.4; the latest 0.21.x changed the API and breaks deep_filter), and kstring
# to 2.0.0 (2.0.4 requires rustc 1.96; our toolchain is 1.94).
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
kstring = "=2.0.0"

[dev-dependencies]
reqwest.workspace = true

# cpal 0.18.1's WASAPI code requires `windows` + `windows-core` to resolve as a
# *matched* pair (its range `>=0.61,<=0.62` lets cargo pair `windows 0.61` with
# `windows-core 0.62`, which breaks compilation). Pin both to 0.62.2 so the
# whole graph shares one matched pair.
[target.'cfg(target_os = "windows")'.dependencies]
# Features for the WASAPI raw-mode mic capture (APO bypass — the Discord
# "Bypass System Audio Input Processing" equivalent).
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", # PROPVARIANT (IMMDevice::Activate signature)
  "Win32_System_Threading",
] }
windows-core = "=0.62.2"
